<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Virtual Rakhi</title>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  video {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: block;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
  }

  #text {
    position: fixed;
    top: 30px;
    left: 20px;
    right: 20px;
    z-index: 10;
    text-align: center;
    color: white;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 2px 5px black;
  }
</style>

</head>

<body>

<div id="text">✋ Show me your hand</div>

<video id="camera" autoplay playsinline muted></video> <canvas id="canvas"></canvas>

<!-- MediaPipe Hands -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const text = document.getElementById("text");


// Load Rakhi image
const rakhi = new Image();
rakhi.src = "rakhi.png";


// Start BACK camera

navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: {
      exact: "environment"
    }
  },
  audio: false
})

.then(stream => {

  video.srcObject = stream;

  video.onloadedmetadata = () => {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    detect();

  };

})

.catch(error => {

  text.innerHTML =
    "Camera error: " + error.message;

});


// MediaPipe Hand Detection

const hands = new Hands({

  locateFile: file =>
    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file

});


hands.setOptions({

  maxNumHands: 1,

  modelComplexity: 0,

  minDetectionConfidence: 0.6,

  minTrackingConfidence: 0.6

});


// When hand is detected

hands.onResults(results => {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (
    results.multiHandLandmarks &&
    results.multiHandLandmarks.length > 0
  ) {

    const hand =
      results.multiHandLandmarks[0];


    // Wrist landmark

    const wrist =
      hand[0];


    // Palm landmark

    const palm =
      hand[9];


    // Convert wrist position

    const x =
      wrist.x * canvas.width;

    const y =
      wrist.y * canvas.height;


    // Palm position

    const palmX =
      palm.x * canvas.width;

    const palmY =
      palm.y * canvas.height;


    // Rotate Rakhi with hand

    const angle =
      Math.atan2(
        palmY - y,
        palmX - x
      );


    // Draw Rakhi

    if (rakhi.complete) {

      ctx.save();

      ctx.translate(x, y);

      ctx.rotate(angle);


      const size =
        Math.min(
          canvas.width,
          canvas.height
        ) * 0.3;


      ctx.drawImage(
        rakhi,
        -size / 2,
        -size / 2,
        size,
        size
      );


      ctx.restore();

    }


    // Change text after hand is detected

    text.innerHTML =
      "I'm new to this Rakhi concept, but you've been my bro before I knew the concept.<br>🎉 Happy Raksha Bandhan! 🎉";

  }

});


// Detection loop

async function detect() {

  if (video.readyState >= 2) {

    await hands.send({
      image: video
    });

  }

  requestAnimationFrame(detect);

}

</script>

</body>
</html>
