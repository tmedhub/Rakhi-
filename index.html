<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Virtual Rakhi</title>

<style>
  body {
    margin: 0;
    background: black;
    font-family: Arial, sans-serif;
    color: white;
  }

  #camera {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: block;
  }

  #canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
  }

  #message {
    position: fixed;
    bottom: 30px;
    left: 20px;
    right: 20px;
    text-align: center;
    background: rgba(120, 0, 60, 0.85);
    padding: 15px;
    border-radius: 15px;
    display: none;
  }

  #status {
    position: fixed;
    top: 20px;
    width: 100%;
    text-align: center;
    z-index: 10;
  }
</style>

</head>

<body>

<div id="status">Starting camera...</div>

<video id="camera" autoplay playsinline muted></video> <canvas id="canvas"></canvas>

<div id="message">
  ❤️ I'm new to this Rakhi concept, but you've been my bro before I knew the concept.
  <br>
  🎉 Happy Raksha Bandhan! 🎉
</div>

<!-- Hand detection library -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const status = document.getElementById("status");
const message = document.getElementById("message");

let spoken = false;


/* START CAMERA */

async function startCamera() {

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      }
    });

    video.srcObject = stream;

    await video.play();

    status.innerHTML = "📷 Camera ON — Show your hand";

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    detect();

  } catch (error) {

    status.innerHTML =
      "Camera permission failed: " + error.message;

  }

}


/* DRAW RAKHI */

function drawRakhi(x, y, angle) {

  const size = 80;

  ctx.save();

  ctx.translate(x, y);

  ctx.rotate(angle);


  // Rakhi thread

  ctx.beginPath();

  ctx.moveTo(-size, 0);
  ctx.lineTo(size, 0);

  ctx.lineWidth = 12;

  ctx.strokeStyle = "#d40030";

  ctx.stroke();


  // Golden center

  ctx.beginPath();

  ctx.arc(0, 0, 28, 0, Math.PI * 2);

  ctx.fillStyle = "gold";

  ctx.fill();


  // Red center

  ctx.beginPath();

  ctx.arc(0, 0, 18, 0, Math.PI * 2);

  ctx.fillStyle = "red";

  ctx.fill();


  // White jewel

  ctx.beginPath();

  ctx.arc(0, 0, 7, 0, Math.PI * 2);

  ctx.fillStyle = "white";

  ctx.fill();


  ctx.restore();

}


/* HAND DETECTION */

const hands = new Hands({

  locateFile: (file) =>

    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file

});


hands.setOptions({

  maxNumHands: 1,

  modelComplexity: 0,

  minDetectionConfidence: 0.6,

  minTrackingConfidence: 0.6

});


hands.onResults(results => {

  // Clear previous Rakhi

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (
    results.multiHandLandmarks &&
    results.multiHandLandmarks.length > 0
  ) {

    const hand =
      results.multiHandLandmarks[0];


    // Wrist = point 0
    // Palm = point 9

    const wrist = hand[0];
    const palm = hand[9];


    // Convert to screen position

    const x =
      wrist.x * canvas.width;

    const y =
      wrist.y * canvas.height;


    // Calculate rotation

    const palmX =
      palm.x * canvas.width;

    const palmY =
      palm.y * canvas.height;


    const angle =
      Math.atan2(
        palmY - y,
        palmX - x
      );


    // Draw Rakhi

    drawRakhi(x, y, angle);


    // Show message

    message.style.display =
      "block";


    status.innerHTML =
      "🎀 Rakhi detected on your wrist!";


    // Speak once

    if (!spoken) {

      spoken = true;

      const speech =
        new SpeechSynthesisUtterance(

          "I'm new to this Rakhi concept, but you've been my bro before I knew the concept. Happy Raksha Bandhan!"

        );

      window.speechSynthesis.speak(
        speech
      );

    }

  }

});


/* DETECTION LOOP */

async function detect() {

  if (video.readyState >= 2) {

    await hands.send({
      image: video
    });

  }

  requestAnimationFrame(detect);

}


/* START */

startCamera();

</script>

</body>
</html>
