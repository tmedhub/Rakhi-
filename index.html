<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Virtual Rakhi</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
  }

  /* Camera */
  #camera {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    background: black;
  }

  /* Rakhi overlay */
  #canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
  }

  /* Main message */
  #message {
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 700px;

    text-align: center;
    padding: 15px 20px;

    border-radius: 20px;

    background: rgba(55, 0, 55, 0.75);

    color: white;

    font-size: clamp(18px, 5vw, 28px);
    font-weight: bold;
    line-height: 1.4;

    z-index: 10;

    text-shadow: 2px 2px 5px black;

    box-shadow: 0 0 20px rgba(255, 190, 0, 0.8);
  }

  /* Happy Raksha Bandhan highlight */
  .highlight {
    display: block;
    margin-top: 8px;
    color: #ffd700;
    font-size: 1.15em;
    text-shadow:
      0 0 10px #ff0000,
      0 0 20px #ff9900;
  }

  /* Status at bottom */
  #status {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);

    background: rgba(0, 0, 0, 0.65);
    color: white;

    padding: 10px 20px;
    border-radius: 30px;

    font-size: 16px;

    z-index: 10;

    white-space: nowrap;
  }
</style>

</head>

<body>

<!-- Top text -->

<div id="message">
  ✋ Show me your hand
</div>

<!-- Bottom status -->

<div id="status">
  📷 Starting back camera...
</div>

<!-- Camera -->

<video
id="camera"
autoplay
playsinline
muted> </video>

<!-- Rakhi overlay -->

<canvas id="canvas"></canvas>

<!-- MediaPipe Hands -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const message = document.getElementById("message");
const status = document.getElementById("status");


/* Load Rakhi image */

const rakhi = new Image();
rakhi.src = "rakhi.png";


/* Start back camera */

async function startCamera() {

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: "environment"
        }
      },
      audio: false
    });


    video.srcObject = stream;

    await video.play();


    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;


    status.innerHTML = "✋ Show your hand to the camera";


    detect();

  }

  catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ Please allow camera permission";

  }

}


/* Draw Rakhi */

function drawRakhi(x, y, angle) {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.save();


  /* Move to wrist */

  ctx.translate(x, y);


  /*
  Rotate with hand
  + Math.PI = 180 degrees
  */

  ctx.rotate(angle + Math.PI);


  /* Rakhi size */

  const size =
    Math.min(canvas.width, canvas.height) * 0.32;


  /* Draw Rakhi */

  ctx.drawImage(
    rakhi,
    -size / 2,
    -size / 2,
    size,
    size
  );


  ctx.restore();

}


/* Setup MediaPipe */

const hands = new Hands({

  locateFile: function(file) {

    return
      "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
      file;

  }

});


hands.setOptions({

  maxNumHands: 1,

  modelComplexity: 1,

  minDetectionConfidence: 0.6,

  minTrackingConfidence: 0.6

});


/* When hand is detected */

hands.onResults(function(results) {


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (
    results.multiHandLandmarks &&
    results.multiHandLandmarks.length > 0
  ) {

    const hand =
      results.multiHandLandmarks[0];


    /* Wrist */

    const wrist =
      hand[0];


    /* Palm */

    const palm =
      hand[9];


    /* Convert wrist coordinates */

    const wristX =
      wrist.x * canvas.width;

    const wristY =
      wrist.y * canvas.height;


    /* Convert palm coordinates */

    const palmX =
      palm.x * canvas.width;

    const palmY =
      palm.y * canvas.height;


    /* Calculate hand direction */

    const angle =
      Math.atan2(
        palmY - wristY,
        palmX - wristX
      );


    /* Draw Rakhi */

    if (
      rakhi.complete &&
      rakhi.naturalWidth > 0
    ) {

      drawRakhi(
        wristX,
        wristY,
        angle
      );

    }


    /* Display greeting */

    message.innerHTML =
      "❤️ I'm new to this Rakhi concept,<br>" +
      "but you've been my bro before I knew the concept." +
      "<span class='highlight'>" +
      "🎉 Happy Raksha Bandhan! 🎉" +
      "</span>";


    status.innerHTML =
      "🎀 Rakhi placed!";

  }

  else {

    /* No hand detected */

    message.innerHTML =
      "✋ Show me your hand";


    status.innerHTML =
      "📷 Looking for your hand...";

  }

});


/* Detection loop */

async function detect() {

  if (video.readyState >= 2) {

    await hands.send({
      image: video
    });

  }

  requestAnimationFrame(detect);

}


/* Start application */

startCamera();


/* Adjust canvas if screen changes */

window.addEventListener("resize", function() {

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

});

</script>

</body>
</html>
