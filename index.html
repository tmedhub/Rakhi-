<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rakhi 🎀</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #2a073d, #6b1249);
      color: white;
      text-align: center;
    }

    h1 {
      margin: 0;
      padding: 20px 10px 5px;
      font-size: clamp(1.7rem, 5vw, 2.5rem);
    }

    .subtitle {
      margin: 5px 15px 20px;
      opacity: 0.9;
    }

    #startButton {
      border: none;
      border-radius: 50px;
      padding: 15px 30px;
      margin-bottom: 20px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #ffcc33;
      color: #4a092d;
    }

    #status {
      margin: 0 10px 15px;
      min-height: 25px;
      font-size: 15px;
    }

    .camera-box {
      position: relative;
      width: min(96vw, 720px);
      margin: auto;
      overflow: hidden;
      border-radius: 22px;
      background: #000;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    #webcam {
      display: none;
    }

    #output {
      display: block;
      width: 100%;
      height: auto;
      transform: scaleX(-1);
    }

    #message {
      width: min(90vw, 720px);
      margin: 20px auto;
      padding: 20px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.13);
      line-height: 1.6;
      font-size: clamp(1rem, 4vw, 1.25rem);
      opacity: 0;
      transform: translateY(15px);
      transition: 0.5s;
    }

    #message.show {
      opacity: 1;
      transform: translateY(0);
    }

    .footer {
      padding: 15px;
      opacity: 0.7;
      font-size: 13px;
    }
  </style>

</head>

<body>

  <h1>🎀 Virtual Rakhi</h1>

  <p class="subtitle">
    Show your hand to the camera and receive a virtual Rakhi!
  </p>

<button id="startButton">📷 Start Camera</button>

  <div id="status">
    Camera is not started
  </div>

  <div class="camera-box">
    <video
      id="webcam"
      autoplay
      playsinline
      muted>
    </video>

<canvas id="output"></canvas>
```

  </div>

  <div id="message">
    I'm new to this Rakhi concept, but you've been my brother before I knew the concept.
    <br><br>
    🎉 <strong>Happy Raksha Bandhan!</strong> 🎉
  </div>

  <div class="footer">
    Show your wrist clearly to the camera ✋
  </div>

  <!-- MediaPipe Hands -->

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js">
  </script>

  <script>
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("output");
    const ctx = canvas.getContext("2d");

    const startButton = document.getElementById("startButton");
    const statusText = document.getElementById("status");
    const messageBox = document.getElementById("message");

    let cameraStarted = false;
    let messageSpoken = false;


    /*
    -------------------------------------------------
    CREATE A RAKHI GRAPHIC USING CANVAS
    -------------------------------------------------
    */

    function drawRakhi(wrist, palm) {

      // Convert MediaPipe normalized coordinates
      // to canvas coordinates.

      const wristX = wrist.x * canvas.width;
      const wristY = wrist.y * canvas.height;

      const palmX = palm.x * canvas.width;
      const palmY = palm.y * canvas.height;


      /*
      Calculate the direction of the hand.

      This allows the Rakhi to rotate with the wrist.
      */

      const angle = Math.atan2(
        palmY - wristY,
        palmX - wristX
      );


      /*
      Rakhi size changes according to
      the size of the camera canvas.
      */

      const rakhiSize = Math.min(
        canvas.width,
        canvas.height
      ) * 0.18;


      ctx.save();

      // Move to wrist
      ctx.translate(wristX, wristY);

      // Rotate Rakhi with hand
      ctx.rotate(angle);


      /*
      -------------------------------
      DRAW THE THREAD
      -------------------------------
      */

      ctx.beginPath();

      ctx.moveTo(
        -rakhiSize * 1.5,
        0
      );

      ctx.lineTo(
        rakhiSize * 1.5,
        0
      );

      ctx.lineWidth =
        rakhiSize * 0.16;

      ctx.strokeStyle = "#d71920";

      ctx.stroke();


      // Golden thread line

      ctx.beginPath();

      ctx.moveTo(
        -rakhiSize * 1.5,
        0
      );

      ctx.lineTo(
        rakhiSize * 1.5,
        0
      );

      ctx.lineWidth =
        rakhiSize * 0.05;

      ctx.strokeStyle = "#ffd700";

      ctx.stroke();


      /*
      -------------------------------
      DRAW THE RAKHI CENTER
      -------------------------------
      */

      // Outer golden circle

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        rakhiSize * 0.45,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#ffd700";

      ctx.fill();


      // Inner red circle

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        rakhiSize * 0.30,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#c91c32";

      ctx.fill();


      // Center jewel

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        rakhiSize * 0.13,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#ffffff";

      ctx.fill();


      /*
      Decorative petals
      */

      for (let i = 0; i < 8; i++) {

        ctx.save();

        ctx.rotate(
          (Math.PI * 2 / 8) * i
        );

        ctx.beginPath();

        ctx.ellipse(
          rakhiSize * 0.48,
          0,
          rakhiSize * 0.22,
          rakhiSize * 0.10,
          0,
          0,
          Math.PI * 2
        );

        ctx.fillStyle = "#ffcc33";

        ctx.fill();

        ctx.restore();
      }


      ctx.restore();
    }



    /*
    -------------------------------------------------
    SPEAK THE MESSAGE
    -------------------------------------------------
    */

    function speakGreeting() {

      if (messageSpoken) {
        return;
      }

      messageSpoken = true;

      const text =
        "I'm new to this Rakhi concept, but you've been my bro before I knew the concept. Happy Raksha Bandhan!";

      const speech =
        new SpeechSynthesisUtterance(text);

      speech.rate = 0.9;
      speech.pitch = 1;

      window.speechSynthesis.cancel();

      window.speechSynthesis.speak(speech);
    }



    /*
    -------------------------------------------------
    MEDIAPIPE HAND DETECTION
    -------------------------------------------------
    */

    const hands = new Hands({

      locateFile: (file) => {

        return
          "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
          file;

      }

    });


    hands.setOptions({

      maxNumHands: 1,

      modelComplexity: 1,

      minDetectionConfidence: 0.7,

      minTrackingConfidence: 0.7

    });



    /*
    -------------------------------------------------
    WHEN MEDIAPIPE DETECTS A HAND
    -------------------------------------------------
    */

    hands.onResults((results) => {

      if (
        video.videoWidth === 0 ||
        video.videoHeight === 0
      ) {
        return;
      }


      // Set canvas size once video is ready

      canvas.width =
        video.videoWidth;

      canvas.height =
        video.videoHeight;


      /*
      Clear old frame
      */

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      /*
      Draw camera frame
      */

      ctx.drawImage(
        results.image,
        0,
        0,
        canvas.width,
        canvas.height
      );


      /*
      Check whether a hand exists
      */

      if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
      ) {

        const landmarks =
          results.multiHandLandmarks[0];


        /*
        MediaPipe landmarks:

        0 = Wrist

        9 = Middle finger MCP
        (near the center of the palm)
        */

        const wrist =
          landmarks[0];

        const palm =
          landmarks[9];


        /*
        Draw Rakhi
        */

        drawRakhi(
          wrist,
          palm
        );


        /*
        Show message
        */

        messageBox.classList.add(
          "show"
        );


        /*
        Speak greeting
        */

        speakGreeting();


        statusText.textContent =
          "✋ Hand detected! Rakhi placed on your wrist 🎀";

      }

      else {

        statusText.textContent =
          "Show your hand to the camera ✋";

      }

    });



    /*
    -------------------------------------------------
    START CAMERA
    -------------------------------------------------
    */

    startButton.addEventListener(
      "click",

      async () => {

        if (cameraStarted) {
          return;
        }


        try {

          statusText.textContent =
            "Requesting camera access...";


          /*
          Get phone/computer camera
          */

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {

                facingMode: {
                  ideal: "user"
                }

              },

              audio: false

            });


          video.srcObject =
            stream;


          await video.play();


          cameraStarted =
            true;


          startButton.style.display =
            "none";


          statusText.textContent =
            "Camera started. Show your hand ✋";


          /*
          Process every frame
          */

          async function processFrame() {

            if (!cameraStarted) {
              return;
            }


            await hands.send({

              image: video

            });


            requestAnimationFrame(
              processFrame
            );

          }


          processFrame();

        }

        catch (error) {

          console.error(error);


          statusText.textContent =
            "❌ Camera access failed. Please allow camera permission.";


          alert(
            "Unable to access the camera. Please allow camera permission and use HTTPS or localhost."
          );

        }

      }

    );
  </script>

</body>
</html>
