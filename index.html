<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Rakhi</title>

<style>
  body {
    margin: 0;
    background: black;
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
  }

  #camera {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: block;
  }

  #canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
  }

  /* Elegant message card */

  #message {
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);

    width: 88%;
    max-width: 680px;

    text-align: center;
    padding: 16px 22px;

    border-radius: 18px;

    background: linear-gradient(
      135deg,
      rgba(40, 5, 25, 0.88),
      rgba(95, 15, 45, 0.82)
    );

    border: 1px solid rgba(255, 215, 0, 0.7);

    color: #fff8e7;

    /* Slightly smaller text */
    font-size: clamp(16px, 3.8vw, 23px);

    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0.2px;

    text-shadow:
      1px 2px 5px rgba(0, 0, 0, 0.8);

    box-shadow:
      0 8px 30px rgba(0, 0, 0, 0.5);

    z-index: 10;
  }

  .highlight {
    display: block;
    margin-top: 10px;
    padding-top: 8px;

    border-top:
      1px solid rgba(255, 215, 0, 0.45);

    color: #ffd66b;

    font-size: 1.15em;
    font-weight: bold;
    letter-spacing: 0.7px;

    text-shadow:
      0 0 12px rgba(255, 190, 50, 0.5);
  }


  /* Start button */

  #startButton {
    position: fixed;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    z-index: 100;

    padding: 16px 34px;

    border:
      1px solid rgba(255, 215, 0, 0.8);

    border-radius: 30px;

    background: linear-gradient(
      135deg,
      #6b1238,
      #3d071f
    );

    color: #ffe8a3;

    font-family:
      Georgia, "Times New Roman", serif;

    font-size: 19px;
    letter-spacing: 0.8px;

    cursor: pointer;

    box-shadow:
      0 5px 25px rgba(0, 0, 0, 0.6);
  }

  #startButton:active {
    transform:
      translate(-50%, -50%)
      scale(0.97);
  }


  /* Bottom status */

  #status {
    position: fixed;
    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(0, 0, 0, 0.65);

    border:
      1px solid rgba(255, 255, 255, 0.15);

    color: #f5e7d0;

    padding: 10px 22px;

    border-radius: 30px;

    font-size: 14px;

    z-index: 10;

    white-space: nowrap;
    letter-spacing: 0.4px;
  }

</style>

</head>

<body>

<div id="message">
  Show me your hand
</div>

<button id="startButton">
  Start Camera
</button>

<div id="status">
  Tap Start Camera to begin
</div>

<video
id="camera"
autoplay
playsinline
muted> </video>

<canvas id="canvas"></canvas>

<!-- MediaPipe Hands -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const message = document.getElementById("message");
const status = document.getElementById("status");
const startButton = document.getElementById("startButton");


/* Load Rakhi image */

const rakhi = new Image();
rakhi.src = "rakhi.png";


/* Create MediaPipe hand detector */

const hands = new Hands({

  locateFile: file =>
    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file

});


hands.setOptions({

  maxNumHands: 1,

  modelComplexity: 0,

  minDetectionConfidence: 0.6,

  minTrackingConfidence: 0.6

});


/* Process hand detection results */

hands.onResults(results => {


  /* Clear previous Rakhi */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* Check if a hand was found */

  if (
    results.multiHandLandmarks &&
    results.multiHandLandmarks.length > 0
  ) {


    const hand =
      results.multiHandLandmarks[0];


    /* Landmark 0 = wrist */
    const wrist = hand[0];

    /* Landmark 9 = middle of palm */
    const palm = hand[9];


    /* Convert coordinates */

    const wristX =
      wrist.x * canvas.width;

    const wristY =
      wrist.y * canvas.height;


    const palmX =
      palm.x * canvas.width;

    const palmY =
      palm.y * canvas.height;


    /* Calculate hand angle */

    const angle =
      Math.atan2(
        palmY - wristY,
        palmX - wristX
      );


    /* Draw Rakhi */

    if (
      rakhi.complete &&
      rakhi.naturalWidth > 0
    ) {


      ctx.save();


      /* Move drawing to wrist */

      ctx.translate(
        wristX,
        wristY
      );


      /*
      Rotate with hand
      + Math.PI = 180 degrees
      */

      ctx.rotate(
        angle + Math.PI
      );


      /* Rakhi size */

      const size =
        Math.min(
          canvas.width,
          canvas.height
        ) * 0.3;


      /* Draw image */

      ctx.drawImage(
        rakhi,
        -size / 2,
        -size / 2,
        size,
        size
      );


      ctx.restore();

    }


    /* HAND FOUND — show greeting */

    message.innerHTML =
      "I'm new to this Rakhi concept,<br>" +
      "but you've been my bro before I knew the concept." +
      "<span class='highlight'>" +
      "Happy Raksha Bandhan ♥" +
      "</span>";


    /* IMPORTANT: Update status when hand is found */

    status.innerHTML =
      "Rakhi tied :)";


  }

  else {


    /* NO HAND FOUND */

    message.innerHTML =
      "Show me your hand";


    status.innerHTML =
      "Looking for your hand...";

  }

});


/*
  Hand detection loop.

  setTimeout prevents multiple
  detection requests from overlapping.
*/

async function detect() {

  if (video.readyState >= 2) {

    try {

      await hands.send({
        image: video
      });

    }

    catch (error) {

      console.error(error);

    }

  }


  setTimeout(
    detect,
    30
  );

}


/* Start camera after button click */

startButton.addEventListener(
  "click",

  async () => {

    try {

      status.innerHTML =
        "Requesting camera permission...";


      const stream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            }

          },

          audio: false

        });


      video.srcObject =
        stream;


      await video.play();


      /*
      Use actual video dimensions
      so Rakhi aligns correctly.
      */

      canvas.width =
        video.videoWidth;

      canvas.height =
        video.videoHeight;


      /* Hide button */

      startButton.style.display =
        "none";


      status.innerHTML =
        "Show me your hand";


      /* Start detection */

      detect();

    }

    catch (error) {

      console.error(error);


      status.innerHTML =
        "Camera permission was denied";

    }

  }

);

</script>

</body>
</html>
