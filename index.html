<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Virtual Rakhi</title>

<style>
  body {
    margin: 0;
    background: black;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  #camera {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: block;
  }

  #canvas {
    position: fixed;
    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    pointer-events: none;
  }

  #message {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);

    width: 90%;
    max-width: 700px;

    text-align: center;

    padding: 16px 20px;

    border-radius: 20px;

    background: rgba(45, 0, 45, 0.75);

    color: white;

    font-size: clamp(20px, 5vw, 30px);
    font-weight: bold;

    line-height: 1.4;

    text-shadow: 2px 2px 5px black;

    z-index: 10;
  }

  .highlight {
    display: block;
    margin-top: 8px;

    color: #ffd700;

    font-size: 1.2em;

    text-shadow:
      0 0 10px #ff0000,
      0 0 20px #ff9900;
  }

  #startButton {
    position: fixed;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    z-index: 100;

    padding: 18px 35px;

    border: none;
    border-radius: 30px;

    background: #ffd700;

    color: #4a0030;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;
  }

  #status {
    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(0, 0, 0, 0.65);

    color: white;

    padding: 10px 20px;

    border-radius: 30px;

    font-size: 16px;

    z-index: 10;
  }
</style>

</head>

<body>

<div id="message">
  ✋ Show me your hand
</div>

<button id="startButton">
  📷 Start Camera
</button>

<div id="status">
  Tap Start Camera to begin
</div>

<video
id="camera"
autoplay
playsinline
muted> </video>

<canvas id="canvas"></canvas>

<!-- MediaPipe Hands -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>


const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const message =
  document.getElementById("message");

const status =
  document.getElementById("status");

const startButton =
  document.getElementById("startButton");



/*
LOAD RAKHI IMAGE
*/

const rakhi =
  new Image();

rakhi.src =
  "rakhi.png";



/*
MEDIAPIPE HAND DETECTION
*/

const hands =
  new Hands({

    locateFile: file =>
      "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file

  });


hands.setOptions({

  maxNumHands: 1,

  modelComplexity: 0,

  minDetectionConfidence: 0.6,

  minTrackingConfidence: 0.6

});



/*
WHEN HAND IS DETECTED
*/

hands.onResults(results => {


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (

    results.multiHandLandmarks &&

    results.multiHandLandmarks.length > 0

  ) {


    const hand =
      results.multiHandLandmarks[0];


    // Wrist

    const wrist =
      hand[0];


    // Palm

    const palm =
      hand[9];



    const wristX =
      wrist.x * canvas.width;

    const wristY =
      wrist.y * canvas.height;



    const palmX =
      palm.x * canvas.width;

    const palmY =
      palm.y * canvas.height;



    /*
    Calculate hand direction
    */

    const angle =
      Math.atan2(

        palmY - wristY,

        palmX - wristX

      );



    /*
    DRAW RAKHI
    */

    if (

      rakhi.complete &&

      rakhi.naturalWidth > 0

    ) {


      ctx.save();


      ctx.translate(
        wristX,
        wristY
      );


      /*
      180 DEGREE ROTATION
      */

      ctx.rotate(
        angle + Math.PI
      );


      const size =
        Math.min(
          canvas.width,
          canvas.height
        ) * 0.3;


      ctx.drawImage(

        rakhi,

        -size / 2,

        -size / 2,

        size,

        size

      );


      ctx.restore();

    }



    /*
    SHOW GREETING
    */

    message.innerHTML =

      "❤️ I'm new to this Rakhi concept,<br>" +

      "but you've been my bro before I knew the concept." +

      "<span class='highlight'>" +

      "🎉 Happy Raksha Bandhan! 🎉" +

      "</span>";


    status.innerHTML =
      "🎀 Rakhi placed!";

  }


  else {


    message.innerHTML =
      "✋ Show me your hand";


    status.innerHTML =
      "📷 Looking for your hand...";

  }

});



/*
HAND DETECTION LOOP
*/

async function detect() {


  if (
    video.readyState >= 2
  ) {

    await hands.send({

      image: video

    });

  }


  requestAnimationFrame(
    detect
  );

}



/*
START CAMERA ONLY AFTER
USER CLICKS THE BUTTON
*/

startButton.addEventListener(
  "click",

  async () => {

    try {


      /*
      THIS TRIGGERS THE
      BROWSER CAMERA PERMISSION
      POPUP
      */

      const stream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            }

          },

          audio: false

        });



      video.srcObject =
        stream;


      await video.play();



      canvas.width =
        video.videoWidth;

      canvas.height =
        video.videoHeight;



      /*
      HIDE BUTTON AFTER
      CAMERA STARTS
      */

      startButton.style.display =
        "none";


      status.innerHTML =
        "✋ Show your hand";



      /*
      START HAND DETECTION
      */

      detect();


    }

    catch (error) {


      console.error(error);


      status.innerHTML =
        "❌ Camera permission was denied";

    }

  }

);


</script>

</body>
</html>
